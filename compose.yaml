name: agrosphere-congress
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agrosphere
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: agrosphere
    ports: ["127.0.0.1:${DB_PORT:-55432}:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrosphere"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://agrosphere:local_dev_password@db:5432/agrosphere
      DATA_MODE: DEMO
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3100},http://127.0.0.1:${WEB_PORT:-3100}
      IMAGE_STORAGE_PATH: /app/storage
      MODEL_DIR: /models
      MULTICROP_MODEL_DIR: /models/multicrop
    ports: ["127.0.0.1:${API_PORT:-8100}:8000"]
    volumes: ["images:/app/storage", "./ml/artifacts:/models:ro"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=15)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:${API_PORT:-8100}/api/v1
    ports: ["127.0.0.1:${WEB_PORT:-3100}:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/en').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
  marketplace-worker:
    build: ./apps/api
    command: ["python", "-m", "app.market_worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://agrosphere:local_dev_password@db:5432/agrosphere
      IMAGE_STORAGE_PATH: /app/storage
    volumes: ["images:/app/storage"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres:
  images:
