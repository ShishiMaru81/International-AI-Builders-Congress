# Free competition/demo resources only. Free database expires after 30 days;
# uploaded files are ephemeral. No persistent paid disk is provisioned.
services:
  - type: web
    name: zyntrix-agrosphere-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/api.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zyntrix-agrosphere-demo-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: DATA_MODE
        value: DEMO
      - key: HOSTING_TIER
        value: free_demo
databases:
  - name: zyntrix-agrosphere-demo-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []
    databaseName: agrosphere
    user: agrosphere
