[build]
  base = "apps/web"
  command = "node ../../scripts/netlify-preflight.mjs && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_DEPLOYMENT_TIER = "free_demo"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
